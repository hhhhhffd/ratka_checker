[package]
name = "ratscan-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ratscan"
path = "src/main.rs"

[workspace]
members = [
    ".",
    "crates/ratscan-models",
    "crates/ratscan-core",
    "crates/ratscan-api",
]
resolver = "2"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["multipart", "macros"] }
bytes = "1.7"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
hex = "0.4"
http-body-util = "0.1"
regex = "1.10"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
thiserror = "1.0"
tempfile = "3.12"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "fs", "process", "signal", "time"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
zip = "2.2"
ratscan-models = { path = "crates/ratscan-models" }
ratscan-core = { path = "crates/ratscan-core" }
