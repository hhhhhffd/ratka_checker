<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RatScan</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="workspace" aria-labelledby="page-title">
        <div class="topbar">
          <div>
            <p class="eyebrow">Minecraft jar scanner</p>
            <h1 id="page-title">RatScan</h1>
          </div>
          <div class="health" id="healthStatus">Checking API</div>
        </div>

        <form class="scan-form" id="scanForm">
          <label class="field">
            <span>API key</span>
            <input
              id="apiKey"
              name="apiKey"
              type="password"
              autocomplete="off"
              spellcheck="false"
              placeholder="rscan_..."
              required
            >
          </label>

          <label class="dropzone" id="dropzone">
            <input id="fileInput" name="file" type="file" accept=".jar" required>
            <span class="dropzone-title" id="fileTitle">Choose .jar file</span>
            <span class="dropzone-meta" id="fileMeta">Maximum upload is controlled by the backend.</span>
          </label>

          <div class="actions">
            <button class="primary-button" id="submitButton" type="submit">Scan file</button>
            <button class="secondary-button" id="clearButton" type="button">Clear</button>
          </div>
        </form>

        <section class="result-panel" id="resultPanel" hidden>
          <div class="result-header">
            <div>
              <p class="eyebrow">Scan result</p>
              <h2 id="resultTitle">Pending</h2>
            </div>
            <div class="score" id="riskScore">0</div>
          </div>

          <dl class="meta-grid">
            <div>
              <dt>Status</dt>
              <dd id="scanStatus">pending</dd>
            </div>
            <div>
              <dt>SHA-256</dt>
              <dd id="scanHash">-</dd>
            </div>
          </dl>

          <p class="summary" id="summaryText"></p>

          <div class="findings" id="findings"></div>
        </section>

        <section class="raw-panel" id="rawPanel" hidden>
          <div class="raw-header">
            <h2>JSON</h2>
            <button class="secondary-button compact" id="copyJsonButton" type="button">Copy</button>
          </div>
          <pre id="rawJson"></pre>
        </section>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
