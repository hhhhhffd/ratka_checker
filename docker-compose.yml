services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ratscan
      POSTGRES_USER: ratscan
      POSTGRES_PASSWORD: ratscan
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratscan -d ratscan"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ratscan-storage:/app/storage
    restart: unless-stopped

  discord-bot:
    build: .
    command: ["ratscan-discord"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://ratscan:ratscan@postgres:5432/ratscan
      RATSCAN_API_BASE_URL: http://api:8080
    restart: unless-stopped

  dev-ui:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "8081:80"
    volumes:
      - ./deploy/frontend:/usr/share/nginx/html:ro
      - ./dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  telegram-bot:
    build:
      context: .
      dockerfile: telegram_bot/Dockerfile
    depends_on:
      - api
    env_file:
      - .env
    environment:
      RATSCAN_API_BASE_URL: http://api:8080
    restart: unless-stopped

volumes:
  postgres-data:
  ratscan-storage:
