services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ratscan
      POSTGRES_USER: ratscan
      POSTGRES_PASSWORD: ratscan
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratscan -d ratscan"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ratscan-storage:/app/storage

volumes:
  postgres-data:
  ratscan-storage:
