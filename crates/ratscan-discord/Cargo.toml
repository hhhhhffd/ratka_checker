[package]
name = "ratscan-discord"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ratscan-discord"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }
serde_json = "1.0"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "rustls_backend"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
thiserror = "1.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1.10", features = ["serde"] }
ratscan-models = { path = "../ratscan-models" }
ratscan-storage = { path = "../ratscan-storage" }
