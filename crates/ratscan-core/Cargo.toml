[package]
name = "ratscan-core"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1.0"
tracing = "0.1"
# Pure-Rust codecs only, so the scanner also builds for wasm32. Native builds
# add the C-backed codecs and AES below to keep server behavior unchanged.
zip = { version = "2.2", default-features = false, features = ["deflate", "deflate64", "lzma"] }
ratscan-models = { path = "../ratscan-models" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zip = { version = "2.2", default-features = false, features = ["aes-crypto", "bzip2", "time", "xz", "zstd"] }
