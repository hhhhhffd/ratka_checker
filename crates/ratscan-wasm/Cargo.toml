[package]
name = "ratscan-wasm"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
ratscan-core = { path = "../ratscan-core" }
ratscan-models = { path = "../ratscan-models" }
